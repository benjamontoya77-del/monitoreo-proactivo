services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-monitor}
      POSTGRES_DB: monitoreo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitoreo"]
      interval: 5s
      retries: 10
    networks:
      - red_monitoreo

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://monitor:${DB_PASSWORD:-monitor}@db:5432/monitoreo
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    networks:
      - red_monitoreo

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:80"]
    networks:
      - red_monitoreo

  snmp-agent:
    image: alpine:3.20
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache net-snmp &&
             printf 'rocommunity public\nsysLocation Sala_Servidores_TI\nsysContact admin@empresa.cl\n' > /etc/snmp/snmpd.conf &&
             exec snmpd -f -Lo -c /etc/snmp/snmpd.conf"
    networks:
      red_monitoreo:
        ipv4_address: 172.28.0.10

networks:
  red_monitoreo:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata: